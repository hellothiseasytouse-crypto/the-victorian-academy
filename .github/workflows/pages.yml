name: Deploy The Victorian Academy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and upload game
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Extract and check bundled JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          style_at = html.lower().find("<style")
          script_at = html.lower().find("<script")
          if style_at < 0 or script_at < 0:
              raise SystemExit("Bundled CSS or JavaScript is missing from index.html")
          script_open = html.find(">", script_at)
          script_close = html.lower().find("</script>", script_open)
          if script_open < 0 or script_close < 0:
              raise SystemExit("Bundled JavaScript block is incomplete")
          Path("/tmp/victorian-academy.js").write_text(html[script_open + 1:script_close], encoding="utf-8")
          PY
          node --check /tmp/victorian-academy.js

      - name: Verify game entry point
        run: |
          test -s index.html
          grep -qi '<title>The Victorian Academy' index.html
          grep -qi 'open-world Victorian chronicle' index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static game
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    name: Publish game site
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
