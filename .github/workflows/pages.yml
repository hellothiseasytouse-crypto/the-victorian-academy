name: Deploy The Victorian Academy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and upload game
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Extract and check bundled JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\\b[^>]*>([\\s\\S]*?)</script>", html, re.IGNORECASE)
          if not scripts:
              raise SystemExit("No bundled JavaScript found in index.html")
          if not re.search(r"<style\\b", html, re.IGNORECASE):
              raise SystemExit("No bundled stylesheet found in index.html")
          Path("/tmp/victorian-academy.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/victorian-academy.js

      - name: Verify game entry point
        run: |
          test -s index.html
          grep -qi '<title>The Victorian Academy' index.html
          grep -qi 'open-world Victorian chronicle' index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static game
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    name: Publish game site
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
